name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches: [ "main" ] # Cứ mỗi khi anh sửa file app.py hoặc Dockerfile, lệnh build sẽ tự chạy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout mã nguồn từ Repo
      uses: actions/checkout@v3

    - name: Đăng nhập vào Docker Hub đám mây
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Tiến hành Build và Push Image (Hoàn toàn trên mây GitHub)
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # Nó sẽ tự động lấy tên tài khoản của anh để đặt tên Image
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ltx-video-serverless:latest
